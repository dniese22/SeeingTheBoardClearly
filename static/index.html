
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seeing The Board Clearly</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Seeing The Board Clearly</h1>

    <div id="status" class="status" role="status" aria-live="polite">
      Loading...
    </div>

    <div class="risk-card">
      <div class="risk-header">
        <div class="risk-title">Risk Scale</div>
      </div>

      <div class="risk-values">
        <span class="pill">
          Lower Than: <b id="lowerLabel">40%</b>
        </span>
        <span class="pill">
          Higher Than: <b id="higherLabel">60%</b>
        </span>
      </div>

      <div class="risk-bar-wrap">
        <div id="segLower" class="risk-segment lower"></div>
        <div id="segMiddle" class="risk-segment middle"></div>
        <div id="segHigher" class="risk-segment higher"></div>

        <input
          id="lowerMarker"
          class="marker-input"
          type="range"
          min="0"
          max="100"
          value="40"
          aria-label="Lower risk threshold"
        />

        <input
          id="higherMarker"
          class="marker-input"
          type="range"
          min="0"
          max="100"
          value="60"
          aria-label="Higher risk threshold"
        />
      </div>

      <div class="risk-legend">
        <div class="legend-item">
          <span class="legend-swatch lower-swatch"></span>
          Lower
        </div>
        <div class="legend-item">
          <span class="legend-swatch middle-swatch"></span>
          Middle
        </div>
        <div class="legend-item">
          <span class="legend-swatch higher-swatch"></span>
          Higher
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2 class="table-title">Betting Percentages</h2>

        <div class="table-controls">
          <button
            id="highPercentageToggle"
            class="filter-toggle"
            type="button"
            aria-pressed="false"
            title="Show only percentages at or above the Higher Than threshold"
          >
            <span class="toggle-indicator" aria-hidden="true"></span>
            <span id="highPercentageToggleLabel">
              Filter ≥ Higher Than: Off
            </span>
          </button>

          <div class="season-control">
            <label for="teamSelect">Team:</label>
            <select id="teamSelect">
              <option value="">Loading teams...</option>
            </select>
          </div>

          <div class="season-control">
            <label for="seasonSelect">Season:</label>
            <select id="seasonSelect"></select>
          </div>
        </div>
      </div>

      <div class="column-visibility-panel">
        <div class="column-visibility-heading">
          <strong>Visible Columns</strong>
          <button id="showAllColumns" type="button">
            Show All
          </button>
        </div>

        <div
          id="columnToggles"
          class="column-toggles"
          aria-label="Toggle table columns"
        >
          <!-- Generated dynamically from available table columns. -->
        </div>
      </div>

      <table id="metricsTable">
        <thead>
          <tr id="metricsHeaderRow">
            <th>Team</th>
            <th>Win%</th>
            <th>Over%</th>
            <th>Cover ATS%</th>
          </tr>
        </thead>

        <tbody id="metricsTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
