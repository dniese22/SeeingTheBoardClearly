<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Seeing The Board Clearly</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <div class="container">

    <h1>Seeing The Board Clearly</h1>

    <div id="status" class="status">Loading...</div>

    <div class="risk-card">
      <div class="risk-header">
        <div class="risk-title">Risk Scale</div>
      </div>

      <div class="risk-values">
        <span class="pill">Lower Than: <b id="lowerLabel">40%</b></span>
        <span class="pill">Higher Than: <b id="higherLabel">60%</b></span>
      </div>

      <div class="risk-bar-wrap">
        <div id="segLower" class="risk-segment lower"></div>
        <div id="segMiddle" class="risk-segment middle"></div>
        <div id="segHigher" class="risk-segment higher"></div>

        <input id="lowerMarker" class="marker-input" type="range" min="0" max="100" value="40" />
        <input id="higherMarker" class="marker-input" type="range" min="0" max="100" value="60" />
      </div>

      <div class="risk-legend">
        <div class="legend-item"><span class="legend-swatch lower-swatch"></span> Lower</div>
        <div class="legend-item"><span class="legend-swatch middle-swatch"></span> Middle</div>
        <div class="legend-item"><span class="legend-swatch higher-swatch"></span> Higher</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2 class="table-title">Betting Percentages</h2>

        <div class="season-control">
          <label>Season:</label>
          <select id="seasonSelect"></select>
        </div>
      </div>

      <table id="metricsTable">
        <thead>
          <tr>
            <th>Team</th>
            <th>Win%</th>
            <th>Over%</th>
            <th>Cover ATS%</th>
          </tr>
        </thead>
        <tbody id="metricsTbody"></tbody>
      </table>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
