name: Update Betting Data

on:
  schedule:
    # Runs daily at 09:00 UTC — adjust as needed
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  export-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install nflreadpy polars

      - name: Run data export
        run: python export_data.py

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update betting data [skip ci]"
          file_pattern: "static/data/**"